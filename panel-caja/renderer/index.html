<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Panel Caja — Torneo de Poker</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
:root{
  --bg:#0E1A15;
  --panel:#152420;
  --p2:#1B2E27;
  --b:#2B3E36;
  --b2:#3A5148;
  --g:#C9A227;
  --g2:#E4C55E;
  --green:#3E8E63;
  --green2:#5FB183;
  --t:#F2EDE1;
  --d:#9FB0A6;
  --red:#C1503A;
  --red2:#E0755F
}

*{
  box-sizing:border-box
}

body{
  margin:0;
  background:var(--bg);
  color:var(--t);
  font-family:Inter,system-ui
}

.wrap{
  max-width:800px;
  margin:auto;
  padding:24px 20px 60px
}

.login{
  max-width:420px;
  margin:12vh auto
}

.brand{
  text-align:center;
  margin-bottom:25px
}

.ey{
  font:11px 'IBM Plex Mono';
  letter-spacing:.14em;
  text-transform:uppercase;
  color:var(--green2)
}

h1{
  font:34px 'Bebas Neue';
  margin:0
}

h2{
  font:22px 'Bebas Neue';
  margin:0 0 4px
}

.loginbox,
.panel{
  background:var(--panel);
  border:1px solid var(--b);
  border-radius:10px;
  padding:22px 24px;
  margin-bottom:18px
}

.sub,
label{
  font-size:13px;
  color:var(--d)
}

label{
  display:block;
  font-size:12px;
  margin-bottom:5px
}

.field{
  margin-bottom:15px
}

input{
  width:100%;
  background:var(--bg);
  border:1px solid var(--b2);
  border-radius:8px;
  color:var(--t);
  padding:11px 12px;
  font-size:14px
}

button{
  border:1px solid var(--b2);
  background:var(--p2);
  color:var(--t);
  padding:11px 18px;
  border-radius:8px;
  font-weight:600;
  cursor:pointer
}

button:hover{
  border-color:var(--g)
}

.gold{
  background:var(--g);
  color:#2A2000;
  border-color:var(--g)
}

.green{
  background:var(--green);
  border-color:var(--green)
}

.top{
  display:flex;
  justify-content:space-between;
  align-items:center;
  border-bottom:1px solid var(--b2);
  padding-bottom:18px;
  margin-bottom:22px;
  gap:15px
}

.user{
  font:12px 'IBM Plex Mono';
  color:var(--d)
}

.chip{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
  background:var(--p2);
  border:1px solid var(--b);
  border-radius:999px;
  padding:8px 16px;
  font:13px 'IBM Plex Mono';
  color:var(--d);
  margin-bottom:18px
}

.chip b{
  color:var(--g2)
}

.row{
  display:flex;
  gap:14px;
  flex-wrap:wrap
}

.row .field{
  flex:1;
  min-width:150px
}

.search{
  display:flex;
  gap:10px
}

.search input{
  flex:1;
  font:22px 'IBM Plex Mono';
  padding:15px
}

.msg{
  padding:14px;
  border-radius:8px;
  margin-top:15px
}

.warn{
  background:rgba(193,80,58,.14);
  border:1px solid var(--red);
  color:var(--red2)
}

.info{
  background:rgba(63,142,99,.12);
  border:1px solid var(--green);
  color:var(--green2)
}

.card{
  background:var(--p2);
  border:1px solid var(--b);
  border-radius:8px;
  padding:18px;
  margin-top:16px
}

.name{
  font-size:19px;
  font-weight:600
}

.dni{
  font:13px 'IBM Plex Mono';
  color:var(--d);
  margin-top:3px
}

.status{
  margin-top:10px;
  color:var(--d);
  font-size:13px
}

.action{
  border-top:1px dashed var(--b2);
  margin-top:16px;
  padding-top:16px
}

.actions{
  display:flex;
  gap:10px;
  flex-wrap:wrap
}

.ticket{
  margin-top:18px;
  background:var(--bg);
  border:1px dashed var(--g);
  padding:16px;
  border-radius:8px;
  font:13px 'IBM Plex Mono';
  color:var(--d)
}

.ticket b{
  color:var(--t)
}

.hidden{
  display:none
}

.dot{
  width:9px;
  height:9px;
  border-radius:50%;
  display:inline-block;
  background:var(--d);
  margin-right:6px
}

.ok{
  background:var(--green2)
}

.err{
  background:var(--red2)
}
</style>
</head>

<body>

<!-- =========================
     LOGIN
========================= -->

<div id="loginView" class="wrap login">

  <div class="brand">
    <span class="ey">Sector caja</span>
    <h1>Panel Caja</h1>
  </div>

  <div class="loginbox">

    <h2>Iniciar sesión</h2>

    <p class="sub">
      Acceso exclusivo para Caja.
    </p>

    <form id="loginForm">

      <div class="field">
        <label>Usuario</label>
        <input
          id="loginUser"
          autocomplete="username"
          required
        >
      </div>

      <div class="field">
        <label>Contraseña</label>
        <input
          id="loginPass"
          type="password"
          autocomplete="current-password"
          required
        >
      </div>

      <button
        type="submit"
        class="gold"
        style="width:100%"
      >
        Ingresar
      </button>

      <div id="loginMsg"></div>

    </form>

  </div>

</div>


<!-- =========================
     APP
========================= -->

<div id="appView" class="wrap hidden">

  <header class="top">

    <div>
      <span class="ey">Sector caja</span>
      <h1>Panel Caja</h1>
    </div>

    <div class="user">
      <span id="loggedUser"></span>
      ·
      <button id="logout">
        Salir
      </button>
    </div>

  </header>


  <div>
    <span class="dot" id="dot"></span>
    <span id="status">Conectando...</span>
  </div>


  <div class="chip">

    <span>
      Torneo:
      <b id="torneoNombre">—</b>
    </span>

    <span>·</span>

    <span>
      Buy-in
      <b id="torneoBuyin">$0</b>
    </span>

    <span>·</span>

    <span>
      Recompra
      <b id="torneoRecompra">$0</b>
    </span>

  </div>


  <div class="panel">

    <h2>Buscar jugador</h2>

    <p class="sub">
      Ingresá el DNI para verificar inscripción y habilitar la operación.
    </p>

    <div class="search">

      <input
        id="dni"
        maxlength="10"
        placeholder="Número de DNI"
      >

      <button
        class="gold"
        id="buscar"
      >
        Buscar
      </button>

    </div>

    <div id="result"></div>

  </div>

</div>


<script>

/* =========================================
   CONFIGURACIÓN
========================================= */

const API = 'http://127.0.0.1:4002/api';


/* =========================================
   ESTADO DE SESIÓN
========================================= */

let token = sessionStorage.getItem('caja_token');


/* =========================================
   HELPERS
========================================= */

const $ = id => document.getElementById(id);

const money = n =>
  '$' + (Number(n) || 0).toLocaleString('es-AR');

const clean = v =>
  (v || '').replace(/\D/g, '');


function h(extra = {}) {
  return {
    ...extra,
    Authorization: 'Bearer ' + token
  };
}


/* =========================================
   API
========================================= */

async function api(path, opt = {}) {

  const r = await fetch(API + path, {
    ...opt,

    headers: h(
      opt.headers || {}
    )
  });

  /*
   * Si el backend informa que el JWT
   * no es válido o expiró, cerramos sesión.
   */

  if (r.status === 401) {
    logout();
    throw new Error('Sesión expirada.');
  }

  return r;
}


/* =========================================
   MOSTRAR PANEL
========================================= */

function show() {

  $('loginView').classList.add('hidden');

  $('appView').classList.remove('hidden');

  $('loggedUser').textContent =
    sessionStorage.getItem('caja_user') || '';

  conexion();

  config();
}


/* =========================================
   CERRAR SESIÓN
========================================= */

function logout() {

  sessionStorage.removeItem('caja_token');

  sessionStorage.removeItem('caja_user');

  token = null;

  $('appView').classList.add('hidden');

  $('loginView').classList.remove('hidden');

  $('loginUser').value = '';

  $('loginPass').value = '';

  $('loginMsg').innerHTML = '';
}


/* =========================================
   LOGOUT BUTTON
========================================= */

$('logout').onclick = logout;


/* =========================================
   LOGIN
========================================= */

$('loginForm').onsubmit = async e => {

  e.preventDefault();

  $('loginMsg').innerHTML = '';

  try {

    const username =
      $('loginUser').value.trim();

    const password =
      $('loginPass').value;


    const r = await fetch(
      API + '/auth/login',
      {
        method: 'POST',

        headers: {
          'Content-Type': 'application/json'
        },

        body: JSON.stringify({
          username,
          password,
          panel: 'caja'
        })
      }
    );


    const d = await r.json();


    /*
     * Si el backend devuelve un error
     * mostramos el mensaje.
     */

    if (!r.ok) {
      throw new Error(
        d.error || 'Error al iniciar sesión.'
      );
    }


    /*
     * El backend devuelve:
     *
     * {
     *   token: "...",
     *   user: {
     *      username: "...",
     *      role: "caja"
     *   }
     * }
     */

    if (!d.token) {
      throw new Error(
        'El servidor no devolvió el token de sesión.'
      );
    }


    if (!d.user || !d.user.username) {
      throw new Error(
        'El servidor no devolvió los datos del usuario.'
      );
    }


    /*
     * Guardamos JWT.
     */

    token = d.token;

    sessionStorage.setItem(
      'caja_token',
      token
    );


    /*
     * Guardamos usuario.
     */

    sessionStorage.setItem(
      'caja_user',
      d.user.username
    );


    /*
     * Mostramos la aplicación.
     */

    show();

  } catch (e) {

    console.error(
      'Error de login:',
      e
    );

    $('loginMsg').innerHTML =
      '<div class="msg warn">' +
      esc(e.message) +
      '</div>';
  }
};


/* =========================================
   CONEXIÓN CON BACKEND
========================================= */

async function conexion() {

  try {

    const r =
      await api('/health');

    $('dot').className =
      'dot ' + (r.ok ? 'ok' : 'err');

    $('status').textContent =
      r.ok
        ? 'Backend conectado'
        : 'Sin conexión';

  } catch (e) {

    console.error(
      'Error de conexión:',
      e
    );

    $('dot').className =
      'dot err';

    $('status').textContent =
      'Sin conexión';
  }
}


/* =========================================
   CONFIGURACIÓN DEL TORNEO
========================================= */

async function config() {

  try {

    const r =
      await api('/tournament');

    const d =
      await r.json();


    $('torneoNombre').textContent =
      d.nombre || '—';

    $('torneoBuyin').textContent =
      money(d.buyIn);

    $('torneoRecompra').textContent =
      money(d.recompra);

  } catch (e) {

    console.error(
      'Error cargando torneo:',
      e
    );
  }
}


/* =========================================
   BUSCAR JUGADOR
========================================= */

$('buscar').onclick = buscar;


$('dni').onkeydown = e => {

  if (e.key === 'Enter') {
    buscar();
  }

};


async function buscar() {

  const dni =
    clean($('dni').value);


  if (!dni || dni.length < 6) {

    $('result').innerHTML =
      '<div class="msg warn">' +
      'Ingresá un DNI válido.' +
      '</div>';

    return;
  }


  $('result').textContent =
    'Buscando...';


  try {

    const r =
      await api('/players/' + dni);


    /*
     * Jugador no encontrado.
     */

    if (r.status === 404) {

      $('result').innerHTML =
        '<div class="msg warn">' +
        'El jugador no está registrado. ' +
        'Pedile a Dirección que lo dé de alta.' +
        '</div>';

      return;
    }


    const d =
      await r.json();


    if (!r.ok) {

      throw new Error(
        d.error || 'Error buscando jugador.'
      );
    }


    const p =
      d.player;


    const buy =
      !d.yaCompro;


    $('result').innerHTML = `

      <div class="card">

        <div class="name">
          ${esc(p.nombre + ' ' + p.apellido)}
        </div>

        <div class="dni">
          DNI ${esc(p.dni)}
        </div>

        <div class="status">

          ${
            buy
              ? 'Sin buy-in hoy · corresponde BUY-IN'
              : `Ya tiene buy-in hoy · ${d.recomprasCount} recompra(s) · corresponde RECOMPRA`
          }

        </div>

        <div class="action">

          <div class="field">

            <label>Monto</label>

            <input
              id="monto"
              type="number"
              value="0"
              disabled
            >

          </div>

          <button
            id="operar"
            class="${buy ? 'green' : 'gold'}"
            style="width:100%"
          >
            ${buy ? 'Registrar buy-in' : 'Registrar recompra'}
          </button>

        </div>

      </div>
    `;


    /*
     * Actualizamos configuración
     * antes de tomar los montos.
     */

    await config();


    /*
     * Obtenemos el monto desde
     * la configuración mostrada.
     */

    const buyinTexto =
      $('torneoBuyin').textContent
        .replace(/\D/g, '');

    const recompraTexto =
      $('torneoRecompra').textContent
        .replace(/\D/g, '');


    $('monto').value =
      buy
        ? buyinTexto
        : recompraTexto;


    /*
     * Registrar operación.
     */

    $('operar').onclick =
      async () => {

        try {

          const monto =
            Number(
              $('monto').value
            );


          if (!monto || monto <= 0) {

            throw new Error(
              'El monto debe ser mayor a cero.'
            );
          }


          const r2 =
            await api(
              '/transactions',
              {
                method: 'POST',

                headers: {
                  'Content-Type':
                    'application/json'
                },

                body: JSON.stringify({
                  dni: p.dni,

                  monto,

                  cajero:
                    sessionStorage.getItem(
                      'caja_user'
                    ) || ''
                })
              }
            );


          const tx =
            await r2.json();


          if (!r2.ok) {

            throw new Error(
              tx.error ||
              'No se pudo registrar la operación.'
            );
          }


          $('result').insertAdjacentHTML(
            'beforeend',

            `
            <div class="ticket">

              <div>
                <b>
                  ${
                    tx.tipo === 'buyin'
                      ? 'Buy-in confirmado'
                      : 'Recompra confirmada'
                  }
                </b>
              </div>

              <div>
                Jugador
                <b>
                  ${esc(
                    p.nombre + ' ' + p.apellido
                  )}
                </b>
              </div>

              <div>
                DNI
                <b>
                  ${esc(p.dni)}
                </b>
              </div>

              <div>
                Torneo
                <b>
                  ${esc(tx.torneo)}
                </b>
              </div>

              <div>
                Monto
                <b>
                  ${money(tx.monto)}
                </b>
              </div>

              <div>
                Hora
                <b>
                  ${esc(tx.hora)}
                </b>
              </div>

            </div>
            `
          );


          /*
           * Actualizamos el jugador
           * después de registrar.
           */

          buscar();


        } catch (e) {

          console.error(
            'Error registrando operación:',
            e
          );

          $('result').insertAdjacentHTML(

            'beforeend',

            '<div class="msg warn">' +
            esc(e.message) +
            '</div>'
          );
        }

      };


  } catch (e) {

    console.error(
      'Error buscando jugador:',
      e
    );

    $('result').innerHTML =
      '<div class="msg warn">' +
      esc(e.message) +
      '</div>';
  }
}


/* =========================================
   ESCAPAR HTML
========================================= */

function esc(v) {

  return String(v ?? '').replace(
    /[&<>"']/g,

    c => ({
      '&': '&amp;',
      '<': '&lt;',
      '>': '&gt;',
      '"': '&quot;',
      "'": '&#39;'
    }[c])
  );
}


/* =========================================
   RESTAURAR SESIÓN
========================================= */

if (token) {
  show();
}

</script>

</body>
</html>
