<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Panel Caja — Torneo de Poker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0E1A15;--panel:#152420;--panel-2:#1B2E27;--border:#2B3E36;--border-2:#3A5148;
    --gold:#C9A227;--gold-light:#E4C55E;--green:#3E8E63;--green-light:#5FB183;
    --text:#F2EDE1;--text-dim:#9FB0A6;--danger:#C1503A;--danger-light:#E0755F;--radius:10px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{background:var(--bg);color:var(--text);font-family:'Inter',system-ui,sans-serif;min-height:100vh;}
  .wrap{max-width:800px;margin:0 auto;padding:24px 20px 60px;}
  header.top{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--border-2);padding-bottom:18px;margin-bottom:22px;flex-wrap:wrap;gap:14px;}
  .brand .eyebrow{font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--green-light);}
  .brand h1{font-family:'Bebas Neue',sans-serif;font-size:34px;letter-spacing:.03em;margin:0;line-height:1;}
  .status-dot{width:9px;height:9px;border-radius:50%;background:var(--text-dim);display:inline-block;margin-right:6px;}
  .status-dot.ok{background:var(--green-light);}
  .status-dot.error{background:var(--danger-light);}
  .conn{font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--text-dim);}
  .torneo-chip{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:var(--panel-2);border:1px solid var(--border);border-radius:999px;padding:8px 16px;font-family:'IBM Plex Mono',monospace;font-size:13px;color:var(--text-dim);margin-bottom:18px;}
  .torneo-chip b{color:var(--gold-light);font-weight:600;}
  .row{display:flex;gap:14px;flex-wrap:wrap;margin-bottom:18px;}
  .row > div{flex:1;min-width:150px;}
  label{display:block;font-size:12px;color:var(--text-dim);margin-bottom:5px;font-weight:500;}
  input[type=text],input[type=number]{width:100%;background:var(--bg);border:1px solid var(--border-2);border-radius:8px;color:var(--text);padding:10px 12px;font-size:14px;font-family:'Inter',sans-serif;}
  input:focus{outline:none;border-color:var(--gold);}
  .panel{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:22px 24px;margin-bottom:18px;}
  .panel h2{font-family:'Bebas Neue',sans-serif;font-size:22px;letter-spacing:.03em;margin:0 0 4px;}
  .panel .sub{font-size:13px;color:var(--text-dim);margin:0 0 18px;}
  .search-row{display:flex;gap:10px;}
  .search-row input{flex:1;font-size:22px;font-family:'IBM Plex Mono',monospace;letter-spacing:.06em;padding:15px 16px;}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--border-2);background:var(--panel-2);color:var(--text);padding:11px 20px;border-radius:8px;font-size:14px;font-weight:600;cursor:pointer;font-family:'Inter',sans-serif;}
  .btn:hover{border-color:var(--gold);}
  .btn-gold{background:var(--gold);border-color:var(--gold);color:#2A2000;}
  .btn-gold:hover{background:var(--gold-light);}
  .btn-green{background:var(--green);border-color:var(--green);color:#EAFBF0;}
  .btn-green:hover{background:var(--green-light);}
  .btn-block{width:100%;padding:15px;font-size:16px;}
  .result-box{margin-top:20px;}
  .msg{padding:14px 16px;border-radius:8px;font-size:14px;line-height:1.5;}
  .msg-warn{background:rgba(193,80,58,.14);border:1px solid var(--danger);color:var(--danger-light);}
  .player-card{background:var(--panel-2);border:1px solid var(--border);border-radius:8px;padding:18px 20px;margin-top:16px;}
  .player-card .name{font-size:19px;font-weight:600;}
  .player-card .dni{font-family:'IBM Plex Mono',monospace;color:var(--text-dim);font-size:13px;margin-top:2px;}
  .player-card .status{margin-top:10px;font-size:13px;color:var(--text-dim);}
  .player-card .status b{color:var(--gold-light);}
  .action-box{margin-top:16px;padding-top:16px;border-top:1px dashed var(--border-2);}
  .amount-row{display:flex;align-items:center;gap:12px;margin-bottom:14px;}
  .amount-row label{margin:0;flex-shrink:0;}
  .amount-row input{width:130px;font-family:'IBM Plex Mono',monospace;font-size:16px;}
  .ticket{margin-top:18px;background:var(--bg);border:1px dashed var(--gold);border-radius:8px;padding:16px 18px;font-family:'IBM Plex Mono',monospace;font-size:13px;color:var(--text-dim);}
  .ticket .t-title{color:var(--gold-light);font-size:15px;margin-bottom:8px;font-weight:600;}
  .ticket div{display:flex;justify-content:space-between;padding:2px 0;}
  .ticket div b{color:var(--text);}
  .loading{color:var(--text-dim);font-size:13px;padding:10px 0;}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand"><span class="eyebrow">Sector caja</span><h1>Panel Caja</h1></div>
    <div class="conn"><span class="status-dot" id="statusDot"></span><span id="statusText">Conectando...</span></div>
  </header>

  <div class="torneo-chip">
    <span>Torneo: <b id="torneoNombre">—</b></span><span>·</span>
    <span>Buy-in <b id="torneoBuyin">$0</b></span><span>·</span>
    <span>Recompra <b id="torneoRecompra">$0</b></span>
  </div>

  <div class="row">
    <div><label>Cajero / puesto</label><input type="text" id="cajeroNombre" placeholder="Nombre del cajero (opcional)"></div>
  </div>

  <div class="panel">
    <h2>Buscar jugador</h2>
    <p class="sub">Ingresá el DNI para verificar inscripción y habilitar buy-in o recompra.</p>
    <div class="search-row">
      <input type="text" id="dniBuscar" placeholder="Número de DNI" maxlength="10">
      <button class="btn btn-gold" id="btnBuscar" type="button">Buscar</button>
    </div>
    <div id="cajaResult" class="result-box"></div>
  </div>
</div>

<script>
const API = 'http://127.0.0.1:4002/api';

function money(n){ return '$' + (Number(n)||0).toLocaleString('es-AR'); }
function cleanDni(v){ return (v||'').replace(/\D/g,'').trim(); }

async function checkConexion(){
  try{
    const r = await fetch(API+'/health');
    if(r.ok){
      document.getElementById('statusDot').className = 'status-dot ok';
      document.getElementById('statusText').textContent = 'Conectado a la base de datos';
    } else throw new Error();
  }catch(e){
    document.getElementById('statusDot').className = 'status-dot error';
    document.getElementById('statusText').textContent = 'Sin conexión — revisá el .env / internet';
  }
}

let config = { nombre:'Sin configurar', buyIn:0, recompra:0 };
async function loadConfig(){
  try{
    const r = await fetch(API+'/tournament');
    config = await r.json();
  }catch(e){}
  document.getElementById('torneoNombre').textContent = config.nombre;
  document.getElementById('torneoBuyin').textContent = money(config.buyIn);
  document.getElementById('torneoRecompra').textContent = money(config.recompra);
}

document.getElementById('btnBuscar').addEventListener('click', buscarJugador);
document.getElementById('dniBuscar').addEventListener('keydown', e=>{ if(e.key==='Enter') buscarJugador(); });

async function buscarJugador(){
  const dni = cleanDni(document.getElementById('dniBuscar').value);
  const box = document.getElementById('cajaResult');
  if(!dni || dni.length < 6){ box.innerHTML = '<div class="msg msg-warn">Ingresá un DNI válido.</div>'; return; }
  box.innerHTML = '<div class="loading">Buscando...</div>';

  try{
    const r = await fetch(API+'/players/'+dni);
    if(r.status === 404){
      box.innerHTML = `<div class="msg msg-warn">El DNI <b>${dni}</b> no está registrado. Pedile a Dirección que lo dé de alta.</div>`;
      return;
    }
    const data = await r.json();
    const player = data.player;
    const yaCompro = data.yaCompro;
    const statusLine = !yaCompro
      ? 'Sin compras registradas hoy · corresponde <b>buy-in</b>'
      : `Ya realizó buy-in hoy (${data.recomprasCount} recompra${data.recomprasCount===1?'':'s'} adicional${data.recomprasCount===1?'':'es'}) · corresponde <b>recompra</b>`;

    box.innerHTML = `
      <div class="player-card">
        <div class="name">${player.nombre} ${player.apellido}</div>
        <div class="dni">DNI ${player.dni}</div>
        <div class="status">${statusLine}</div>
        <div class="action-box">
          <div class="amount-row">
            <label>Monto</label>
            <input type="number" id="montoOperacion" value="${yaCompro ? config.recompra : config.buyIn}">
          </div>
          <button class="btn ${yaCompro ? 'btn-gold' : 'btn-green'} btn-block" id="btnOperar" type="button">
            ${yaCompro ? 'Registrar recompra' : 'Registrar buy-in'}
          </button>
        </div>
      </div>`;

    document.getElementById('btnOperar').addEventListener('click', async ()=>{
      const monto = Number(document.getElementById('montoOperacion').value)||0;
      const cajero = document.getElementById('cajeroNombre').value.trim();
      try{
        const r2 = await fetch(API+'/transactions', {
          method:'POST',
          headers:{'Content-Type':'application/json'},
          body: JSON.stringify({ dni: player.dni, monto, cajero })
        });
        const tx = await r2.json();
        if(!r2.ok) throw new Error(tx.error);

        const ticket = document.createElement('div');
        ticket.className = 'ticket';
        ticket.innerHTML = `
          <div class="t-title">${tx.tipo==='buyin' ? 'Buy-in confirmado' : 'Recompra confirmada'}</div>
          <div>Jugador <b>${player.nombre} ${player.apellido}</b></div>
          <div>DNI <b>${player.dni}</b></div>
          <div>Torneo <b>${tx.torneo}</b></div>
          <div>Monto <b>${money(tx.monto)}</b></div>
          <div>Hora <b>${tx.hora}</b></div>`;
        box.appendChild(ticket);
        buscarJugador();
      }catch(e){ alert('No se pudo registrar: '+e.message); }
    });
  }catch(e){
    box.innerHTML = '<div class="msg msg-warn">No se pudo conectar con la base de datos.</div>';
  }
}

checkConexion();
loadConfig();
setInterval(checkConexion, 15000);
</script>
</body>
</html>
